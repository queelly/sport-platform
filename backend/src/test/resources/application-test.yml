spring:
  datasource:
    url: jdbc:h2:mem:sportplatform_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: TestSecretKeyForJwtSigning2026MustBeAtLeast32BytesLongForTesting!
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  admin:
    email: admin@sportplatform.ru
    password: AdminPassword123!
    name: Главный Администратор
  seed:
    demo-data: false
  storage:
    upload-dir: ./target/test-uploads
    max-image-bytes: 10485760
    max-document-bytes: 15728640
    max-video-bytes: 52428800
  reminders:
    first-hours: 24
    second-hours: 2
  recurring:
    weeks-ahead: 4
  vk:
    mode: TEST_LOG
    group-id: 123456
    token: ""
    api-version: 5.199
    club-url: https://vk.com/club123456
