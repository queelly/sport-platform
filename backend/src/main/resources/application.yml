server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: sport-platform-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sportplatform}
    username: ${SPRING_DATASOURCE_USERNAME:sportuser}
    password: ${SPRING_DATASOURCE_PASSWORD:sportpass_dev_only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 65MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:SportPlatformSuperSecretKeyForJwtSigning2026MustBeAtLeast32BytesLong!}
    access-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${APP_JWT_REFRESH_TTL_DAYS:7}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@sportplatform.ru}
    password: ${APP_ADMIN_PASSWORD:AdminPassword123!}
    name: ${APP_ADMIN_NAME:Главный Администратор}
  seed:
    demo-data: ${APP_SEED_DEMO_DATA:true}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:./uploads}
    max-image-bytes: ${APP_STORAGE_MAX_IMAGE_BYTES:10485760}
    max-document-bytes: ${APP_STORAGE_MAX_DOCUMENT_BYTES:15728640}
    max-video-bytes: ${APP_STORAGE_MAX_VIDEO_BYTES:52428800}
  reminders:
    first-hours: ${APP_REMINDER_FIRST_HOURS:24}
    second-hours: ${APP_REMINDER_SECOND_HOURS:2}
  recurring:
    weeks-ahead: ${APP_RECURRING_WEEKS_AHEAD:4}
  vk:
    mode: ${APP_VK_MODE:TEST_LOG}
    group-id: ${APP_VK_GROUP_ID:0}
    token: ${APP_VK_TOKEN:}
    api-version: ${APP_VK_API_VERSION:5.199}
    club-url: ${APP_VK_CLUB_URL:https://vk.com/club0}
