services:
  db:
    image: postgres:16-alpine
    container_name: sportplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportplatform}
      POSTGRES_USER: ${POSTGRES_USER:-sportuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportpass_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportuser} -d ${POSTGRES_DB:-sportplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sportnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportplatform-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sportplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sportuser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sportpass_dev_only}
      SERVER_PORT: 8080
      APP_JWT_SECRET: ${JWT_SECRET:-SportPlatformSuperSecretKeyForJwtSigning2026MustBeAtLeast32BytesLong!}
      APP_JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
      APP_JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      APP_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@sportplatform.ru}
      APP_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-AdminPassword123!}
      APP_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Главный Администратор}
      APP_SEED_DEMO_DATA: ${APP_SEED_DEMO_DATA:-true}
      APP_STORAGE_UPLOAD_DIR: ${STORAGE_UPLOAD_DIR:-/var/lib/sportplatform/uploads}
      APP_STORAGE_MAX_IMAGE_BYTES: ${MAX_IMAGE_SIZE_BYTES:-10485760}
      APP_STORAGE_MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_SIZE_BYTES:-15728640}
      APP_STORAGE_MAX_VIDEO_BYTES: ${MAX_VIDEO_SIZE_BYTES:-52428800}
      APP_REMINDER_FIRST_HOURS: ${REMINDER_FIRST_HOURS_BEFORE:-24}
      APP_REMINDER_SECOND_HOURS: ${REMINDER_SECOND_HOURS_BEFORE:-2}
      APP_RECURRING_WEEKS_AHEAD: ${RECURRING_GENERATION_WEEKS_AHEAD:-4}
      APP_VK_MODE: ${VK_BOT_MODE:-TEST_LOG}
      APP_VK_GROUP_ID: ${VK_GROUP_ID:-0}
      APP_VK_TOKEN: ${VK_COMMUNITY_TOKEN:-${VK_GROUP_TOKEN:-}}
      APP_VK_API_VERSION: ${VK_API_VERSION:-5.199}
      APP_VK_CLUB_URL: ${VK_CLUB_URL:-https://vk.com/club0}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/var/lib/sportplatform/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sportnet

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportplatform-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - sportnet

volumes:
  postgres_data:
  uploads_data:

networks:
  sportnet:
    driver: bridge
